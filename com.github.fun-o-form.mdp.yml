id: com.github.fun-o-form.mdp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25 
  
command: mdp

finish-args:
- --socket=x11
- --share=ipc
- --env=PATH=/app/jre/bin:/app/bin:/usr/bin
- --env=JAVA_HOME=/app/jre

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh

  - name: mdp
    buildsystem: simple
    build-options:
      env:
        PATH: /app/bin:/usr/bin:/usr/lib/sdk/openjdk25/bin
        JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
    #build-commands:
    #  - install -Dm755 -t /app/bin myapp
    #  - install -Dm644 -t /app/share/com.example.myapp myapp.jar

    sources:
      - type: archive
        url: https://github.com/fun-o-form/music-dir-player-java/archive/refs/tags/1.2.0.tar.gz
        
    #- type: script
    #  dest-filename: myapp
    #  commands:
    #    - exec java -jar /app/share/com.example.myapp/myapp.jar $@
